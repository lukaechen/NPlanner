name: NPlanner APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore permanent signing key
        env:
          NPLANNER_KEYSTORE_BASE64: ${{ secrets.NPLANNER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NPLANNER_KEYSTORE_BASE64" || { echo "Secret NPLANNER_KEYSTORE_BASE64 fehlt"; exit 1; }
          printf '%s' "$NPLANNER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nplanner-release.jks"
          test -s "$RUNNER_TEMP/nplanner-release.jks" || { echo "Keystore konnte nicht wiederhergestellt werden"; exit 1; }

      - name: Validate signing secrets and keystore
        env:
          NPLANNER_KEYSTORE_PASSWORD: ${{ secrets.NPLANNER_KEYSTORE_PASSWORD }}
          NPLANNER_KEY_ALIAS: ${{ secrets.NPLANNER_KEY_ALIAS }}
          NPLANNER_KEY_PASSWORD: ${{ secrets.NPLANNER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NPLANNER_KEYSTORE_PASSWORD" || { echo "Secret NPLANNER_KEYSTORE_PASSWORD fehlt"; exit 1; }
          test -n "$NPLANNER_KEY_ALIAS" || { echo "Secret NPLANNER_KEY_ALIAS fehlt"; exit 1; }
          test -n "$NPLANNER_KEY_PASSWORD" || { echo "Secret NPLANNER_KEY_PASSWORD fehlt"; exit 1; }
          keytool -list \
            -keystore "$RUNNER_TEMP/nplanner-release.jks" \
            -storepass "$NPLANNER_KEYSTORE_PASSWORD" \
            -alias "$NPLANNER_KEY_ALIAS" > /dev/null

      - name: Build signed release APK
        env:
          NPLANNER_KEYSTORE_PATH: ${{ runner.temp }}/nplanner-release.jks
          NPLANNER_KEYSTORE_PASSWORD: ${{ secrets.NPLANNER_KEYSTORE_PASSWORD }}
          NPLANNER_KEY_ALIAS: ${{ secrets.NPLANNER_KEY_ALIAS }}
          NPLANNER_KEY_PASSWORD: ${{ secrets.NPLANNER_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate and verify signed APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          test -n "$APK" || {
            echo "Keine signierte Release-APK gefunden. Vorhandene APKs:"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NPlanner.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NPlanner-Signed-APK
          path: NPlanner.apk
          if-no-files-found: error
          retention-days: 14
