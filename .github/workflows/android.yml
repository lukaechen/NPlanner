name: NPlanner APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore permanent signing key
        env:
          NPLANNER_KEYSTORE_BASE64: ${{ secrets.NPLANNER_KEYSTORE_BASE64 }}
        run: |
          test -n "$NPLANNER_KEYSTORE_BASE64" || { echo "Missing NPLANNER_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$NPLANNER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nplanner-release.jks"

      - name: Build signed NPlanner APK
        env:
          NPLANNER_KEYSTORE_PATH: ${{ runner.temp }}/nplanner-release.jks
          NPLANNER_KEYSTORE_PASSWORD: ${{ secrets.NPLANNER_KEYSTORE_PASSWORD }}
          NPLANNER_KEY_ALIAS: ${{ secrets.NPLANNER_KEY_ALIAS }}
          NPLANNER_KEY_PASSWORD: ${{ secrets.NPLANNER_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NPlanner-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
